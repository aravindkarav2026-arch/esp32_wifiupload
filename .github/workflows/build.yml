name: Manual Build ESP32-C6 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run PlatformIO Build
        run: |
          pio run -e esp32-c6-devkitc-1

      - name: Package All Flash Binaries
        run: |
          mkdir -p output
          BUILD_DIR=".pio/build/esp32-c6-devkitc-1"
          
          # Copy all 4 required flash files
          cp $BUILD_DIR/bootloader.bin output/bootloader.bin
          cp $BUILD_DIR/partitions.bin output/partitions.bin
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin output/boot_app0.bin
          cp $BUILD_DIR/firmware.bin output/firmware.bin

      - name: Upload Complete Firmware Bundle
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-factory-flash-bundle
          path: output/
          retention-days: 30
